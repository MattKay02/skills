name: Sync README

# Keeps the README's skill list in sync with skills.json. Runs when the manifest
# (or the generator) changes, regenerates the marked block, and commits the
# result. The commit only touches README.md, which isn't in the paths filter, so
# it never retriggers itself.
on:
  push:
    branches: [main]
    paths:
      - skills.json
      - scripts/gen-readme.mjs
      - .github/workflows/sync-readme.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gen-readme.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync skills in README [skip ci]"
            git push
          else
            echo "README already up to date."
          fi
